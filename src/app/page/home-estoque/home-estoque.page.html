
 <ion-header >
  <ion-toolbar lines="none">
    <ion-grid>
      <ion-row class="ion-justify-content-center">
        <ion-col size="7">
          <div class="logo">
            <img id="logo-login" src="../../assets/whiteLogo.svg" />
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true" >

  <div style="height: 80px;margin-top:10%;" *ngIf="origemEstoque === 'frotas'">
    <ion-grid class="ion-no-padding">
      <ion-row class="ion-justify-content-center">
        <ion-col size="5" >
          <ion-button style="font-size: 15px; " class="btnGreen "
          (click)="newRequest('req')">Liberação de Equipamento</ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

  <div style="height: 80px;margin-top: 5%;" *ngIf="origemEstoque === 'frotas'">
    <ion-grid  class="ion-no-padding">
      <ion-row class="ion-justify-content-center">
        <ion-col size="5" >
          <ion-button style="font-size: 15px;" class="btnRed"
          (click)="newRequestFrotaBt()">Devolução de Equipamento</ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

  <div style="height: 80px;margin-top: 5%;" *ngIf="origemEstoque === 'obras'">
    <ion-grid  class="ion-no-padding">
      <ion-row class="ion-justify-content-center">
        <ion-col size="5">
          <ion-button style="font-size: 15px; " class="btnBaixaEstoque " (click)="newRequestEpi()">Baixa de Estoque</ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
